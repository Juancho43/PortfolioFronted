
<div class="profile">

  @if (this.photo() !== 'null') {

  <img
    [ngSrc]="photo()"
    priority
    width="200"
    height="300"
    [alt]="profile?.name"
  />
  }@else{
    <p>Cargando...</p>
  }

  <div>
    <h1>{{ profile?.name }}</h1>
    <h2>{{ profile?.rol }}</h2>
    <p>{{ profile?.description! }}</p>
  </div>
</div>
